name: Maven Build and Docker Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:   # allows manual "Run workflow" trigger from the Actions tab

jobs:
  maven-build:
    name: Maven Build
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout (equivalent to "checkout: self")
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java setup (Azure Maven@4 task auto-installs JDK; GitHub Actions needs this explicit)
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'   # matches the JDK used across your other workflow and pom.xml compiler target
          cache: 'maven'

      # 3. Maven Package (equivalent to Maven@4 task)
      - name: Maven Package
        run: mvn -f pom.xml clean package

      # Publish JUnit test results (equivalent to publishJUnitResults: true)
      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Maven Test Results
          path: '**/surefire-reports/TEST-*.xml'
          reporter: java-junit

      # 4. Bash inline script (equivalent to Bash@3 task)
      - name: List built artifact
        run: |
          ls -l webapp/target/webapp.war

      # 5. Docker login using service account / registry credentials stored as GitHub secrets
      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}       # e.g. docker.io, ghcr.io, myregistry.azurecr.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 6. Docker Buildx setup (recommended for build & push)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 7. Docker Build and Push (equivalent to Docker@2 buildAndPush)
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile   # <-- update this to the exact path if your Dockerfile isn't at the repo root
          push: true
          tags: ${{ secrets.DOCKER_REGISTRY }}/helloworld:latest

      # 8. Kubernetes deploy via Azure CLI login (Service Principal) + AKS credentials
      #    (equivalent to KubernetesManifest@1 with kubernetesServiceConnection)
      - name: Azure Login (Service Principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          # AZURE_CREDENTIALS secret must be the JSON output of:
          #   az ad sp create-for-rbac --name "<sp-name>" --role Contributor \
          #     --scopes /subscriptions/<sub-id>/resourceGroups/kubernetes-mgmt-srv \
          #     --sdk-auth
          # Paste the full JSON object as the secret value.

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group kubernetes-mgmt-srv \
            --name azure-aks-hpa \
            --overwrite-existing

      - name: Verify cluster access
        run: kubectl cluster-info

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f deployment.yml -n default
