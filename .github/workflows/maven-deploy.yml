name: Maven Build and Docker Deploy

# Equivalent to Azure DevOps "trigger: - xxxx"
on:
  push:
    branches:
      - main   # <-- replace with your actual trigger branch(es)

jobs:
  maven-build:
    name: Maven Build
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout (equivalent to "checkout: self")
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java setup (Azure Maven@4 task auto-installs JDK; GitHub Actions needs this explicit)
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'   # matches the JDK used across your other workflow and pom.xml compiler target
          cache: 'maven'

      # 3. Maven Package (equivalent to Maven@4 task)
      - name: Maven Package
        run: mvn -f pom.xml clean package

      # Publish JUnit test results (equivalent to publishJUnitResults: true)
      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Maven Test Results
          path: '**/surefire-reports/TEST-*.xml'
          reporter: java-junit

      # 4. Bash inline script (equivalent to Bash@3 task)
      - name: List built artifact
        run: |
          ls -l webapp/target/webapp.war

      # 5. Docker login using service account / registry credentials stored as GitHub secrets
      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}       # e.g. docker.io, ghcr.io, myregistry.azurecr.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 6. Docker Buildx setup (recommended for build & push)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 7. Docker Build and Push (equivalent to Docker@2 buildAndPush)
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: '**/Dockerfile'
          push: true
          tags: ${{ secrets.DOCKER_REGISTRY }}/helloworld:latest

      # 8. Kubernetes deploy using a service account token / kubeconfig stored as a secret
      #    (equivalent to KubernetesManifest@1 with kubernetesServiceConnection)
      - name: Set up kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
        # KUBE_CONFIG secret should contain a base64-encoded kubeconfig file
        # that authenticates using a Kubernetes ServiceAccount token
        # (see notes below on generating this).

      - name: Verify cluster access
        run: kubectl cluster-info

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f deployment.yml -n default
