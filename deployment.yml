apiVersion: apps/v1
kind: Deployment
metadata:
  name: bala-regapp
  labels:
    app: regapp

spec:
  replicas: 5

  selector:
    matchLabels:
      app: regapp

  template:
    metadata:
      labels:
        app: regapp

    spec:
      imagePullSecrets:
        - name: acr-auth

      containers:
        - name: regapp
          image: springbootdockerreg.azurecr.io/helloworld:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1

---

apiVersion: v1
kind: Service
metadata:
  name: helloworld-rtp-service
  namespace: helloworld

spec:
  type: LoadBalancer

  selector:
    app: helloworld

  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000

